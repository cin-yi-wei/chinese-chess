name: build-desktop

# 打 tag（v*）或手動觸發 → Windows + macOS 各自用 PyInstaller 打包成 artifact，
# 最後由單一 release job 一次上傳到 GitHub Release（避免兩個 job 併發寫同一 release 撞車）。
# 權重不打包，執行檔首次啟動從 Release 的 weights 附件自動下載。
on:
  push:
    tags: ["v*", "!*-px0"]   # 排除 px0 tag（那是 build-desktop-px0 的）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            torch_extra: "--index-url https://download.pytorch.org/whl/cu121"
            sep: ";"
          - os: macos-latest
            name: macos
            torch_extra: ""
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview aiohttp numpy
          pip install torch ${{ matrix.torch_extra }}

      - name: PyInstaller
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --windowed --name XiangqiAZ
          --paths ../alphazero
          --hidden-import serve_ws --hidden-import net --hidden-import mcts
          --hidden-import nn_eval --hidden-import xiangqi.board --hidden-import xiangqi.encode
          --add-data "../frontend/dist${{ matrix.sep }}frontend/dist"
          app.py

      - name: Zip artifact (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        working-directory: desktop/dist
        run: Compress-Archive -Path XiangqiAZ -DestinationPath XiangqiAZ-windows.zip -Force

      - name: Zip artifact (macOS)
        if: matrix.name == 'macos'
        working-directory: desktop/dist
        run: |
          if [ -d "XiangqiAZ.app" ]; then zip -r "XiangqiAZ-macos.zip" "XiangqiAZ.app"; else zip -r "XiangqiAZ-macos.zip" "XiangqiAZ"; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiangqiAZ-${{ matrix.name }}
          path: desktop/dist/XiangqiAZ-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: XiangqiAZ-macos
          path: artifacts
      # 只把 macOS 版（<2GB）掛到 Release。Windows CUDA 版 2.4GB 超過 Release 單檔 2GB 上限，
      # 改由 build job 的 workflow artifact 提供（到該次 Actions run 頁面下載，保留 90 天）。
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body: |
            桌面版下載：
            - macOS：下方的 XiangqiAZ-macos.zip
            - Windows（CUDA/GPU 版，2.4GB 超過 Release 上限）：到本 tag 對應的 GitHub Actions run 頁面，下載 artifact「XiangqiAZ-windows」
            首次啟動會自動下載權重（weights release 的 latest.pt）。
