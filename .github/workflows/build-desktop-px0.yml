name: build-desktop-px0

# px0(ONNX)桌面版：Windows / macOS / Linux 三平台各用 PyInstaller 打包,包線上網頁版
# (serve_az + Phaser 前端)。權重(.onnx)不打包,首次啟動從 weights release 下載。
#
# 自動觸發:push 到 dev 且動到網頁/評估器/桌面殼相關檔 → 自動重建三平台 →
#   發到固定的「桌面版(最新)」release(tag=desktop-latest,下載連結不變、永遠最新)。
#   → 網頁怎麼改,桌面版自動同步,不用手動。也可手動 workflow_dispatch。
on:
  push:
    branches: [dev]
    paths:
      - "alphazero/serve_az.py"
      - "alphazero/serve_px0.py"
      - "alphazero/px0_eval.py"
      - "alphazero/px0_encode.py"
      - "alphazero/px0_movestrs.json"
      - "alphazero/mcts.py"
      - "alphazero/xiangqi/**"
      - "frontend/**"
      - "desktop/app_px0.py"
      - ".github/workflows/build-desktop-px0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            ort: onnxruntime-directml   # Windows GPU(DirectML,免 CUDA)
            sep: ";"
          - os: macos-latest
            name: macos
            ort: onnxruntime            # macOS(CPU/CoreML)
            sep: ":"
          - os: ubuntu-latest
            name: linux
            ort: onnxruntime            # Linux(CPU;要 GPU 可自行換 onnxruntime-gpu)
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend (Phaser)
        working-directory: frontend
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview aiohttp numpy ${{ matrix.ort }}

      - name: PyInstaller
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --windowed --name XiangqiPx0
          --paths ../alphazero
          --hidden-import serve_az --hidden-import px0_eval --hidden-import px0_encode
          --hidden-import mcts --hidden-import xiangqi.board --hidden-import xiangqi.encode
          --hidden-import onnxruntime --hidden-import numpy --hidden-import aiohttp
          --add-data "../frontend/dist${{ matrix.sep }}frontend/dist"
          --add-data "../alphazero/px0_movestrs.json${{ matrix.sep }}alphazero"
          app_px0.py

      - name: Zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        working-directory: desktop/dist
        run: Compress-Archive -Path XiangqiPx0 -DestinationPath XiangqiPx0-windows.zip -Force

      - name: Zip (macOS/Linux)
        if: matrix.name != 'windows'
        working-directory: desktop/dist
        run: |
          if [ -d "XiangqiPx0.app" ]; then zip -r "XiangqiPx0-${{ matrix.name }}.zip" "XiangqiPx0.app"; else zip -r "XiangqiPx0-${{ matrix.name }}.zip" "XiangqiPx0"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiangqiPx0-${{ matrix.name }}
          path: desktop/dist/XiangqiPx0-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 固定 tag=desktop-latest 的滾動 release:每次自動更新附件,下載連結永遠不變。
      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: 桌面版(最新)
          files: artifacts/**/*.zip
          body: |
            px0 象棋桌面版(免安裝,雙擊即用)——隨 dev 網頁更新自動重建、永遠最新。
            - Windows：XiangqiPx0-windows.zip（DirectML GPU）
            - macOS：XiangqiPx0-macos.zip
            - Linux：XiangqiPx0-linux.zip（CPU）
            首次啟動自動下載權重(weights release 的 net.onnx)。
