<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>中國象棋</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #1e1a17;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        color: #e8ded0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
        min-height: 100dvh;
      }
      #status {
        margin: 4px 0;
        font-size: clamp(15px, 4vw, 18px);
        letter-spacing: 1px;
        min-height: 22px;
        text-align: center;
      }
      #controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      #controls label { font-size: 14px; opacity: .85; }
      #mode {
        padding: 8px 14px;
        font-size: 15px;
        border: 1px solid #a9784b;
        background: #2b2420;
        color: #e8ded0;
        border-radius: 6px;
        cursor: pointer;
      }
      #mode:hover { background: #3a302a; }
      #custom-wrap { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      #custom-wrap .slabel { font-size: 13px; opacity: .8; }
      #difficulty, #sims { cursor: pointer; vertical-align: middle; width: 120px; }
      #difficulty-val, #sims-val {
        display: inline-block;
        min-width: 2.6em;
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-weight: bold;
        color: #ffd479;
      }
      #controls button {
        padding: 8px 14px;
        font-size: 15px;
        border: 1px solid #a9784b;
        background: #2b2420;
        color: #e8ded0;
        border-radius: 6px;
        cursor: pointer;
      }
      #controls button:hover { background: #3a302a; }
      #controls button:disabled {
        opacity: .4;
        cursor: not-allowed;
      }
      /* RWD：棋盤等比縮放，同時受寬與高限制，直/橫都不跑版 */
      #game {
        width: min(96vw, calc((100dvh - 120px) * 604 / 668), 604px);
        aspect-ratio: 604 / 668;
        box-shadow: 0 10px 40px rgba(0,0,0,.5);
        border-radius: 8px;
        touch-action: manipulation;
      }
      #game canvas { width: 100% !important; height: 100% !important; display: block; }
    </style>
  </head>
  <body>
    <div id="status">連線中…</div>
    <div id="controls">
      <label for="mode">難度</label>
      <select id="mode">
        <option value="easy">簡單</option>
        <option value="medium" selected>中等</option>
        <option value="hard">困難</option>
        <option value="custom">自訂</option>
      </select>
      <span id="custom-wrap" style="display: none">
        <span class="slabel">棋力</span>
        <input id="difficulty" type="range" min="1" max="100" value="50" />
        <span id="difficulty-val">50</span>
        <span class="slabel">模擬數</span>
        <input id="sims" type="range" min="8" max="400" step="4" value="100" />
        <span id="sims-val">100</span>
      </span>
      <button id="new-game">重新開局</button>
      <button id="undo">悔棋</button>
      <button id="resign">認輸</button>
      <button id="prev" title="上一步">◀ 上一步</button>
      <button id="next" title="下一步">下一步 ▶</button>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
